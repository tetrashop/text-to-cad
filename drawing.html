<!DOCTYPE html>
<html>
<head>
    <style>
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        svg { background-color: #ffffff; }
        .line { stroke: #000; stroke-width: 2; fill: none; }
        .dash { stroke: #000; stroke-width: 1; stroke-dasharray: 5,5; fill: none; }
        .center-line { stroke: #0000ff; stroke-width: 1; stroke-dasharray: 10,5,2,5; fill: none; }
        .text { font-family: Arial, sans-serif; font-size: 14px; fill: #000; font-weight: bold; }
    </style>
</head>
<body>
    <!-- نقشه یک پلیت مربعی ۱۰۰x۱۰۰ با ضخامت ۱۰ و ۵ سوراخ -->
    <svg width="400" height="400" viewBox="0 0 400 400">
        
        <!-- خطوط راهنما -->
        <line x1="50" y1="200" x2="350" y2="200" class="center-line" />
        <line x1="200" y1="50" x2="200" y2="350" class="center-line" />

        <!-- بدنه اصلی (مربع ۱۰۰ در ۱۰۰) -->
        <rect x="50" y="50" width="300" height="300" class="line" stroke-width="3" />

        <!-- سوراخ مرکزی (شعاع ۲۰) -->
        <circle cx="200" cy="200" r="60" class="line" stroke-width="2" />
        
        <!-- سوراخ‌های گوشه (شعاع ۵) -->
        <circle cx="80" cy="80" r="15" class="line" />
        <circle cx="320" cy="80" r="15" class="line" />
        <circle cx="80" cy="320" r="15" class="line" />
        <circle cx="320" cy="320" r="15" class="line" />

        <!-- خطوط ابعاد افقی -->
        <line x1="50" y1="30" x2="350" y2="30" class="line" />
        <line x1="50" y1="45" x2="50" y2="25" class="line" />
        <line x1="350" y1="45" x2="350" y2="25" class="line" />
        <text x="185" y="25" class="text">100 mm</text>

        <!-- خطوط ابعاد عمودی -->
        <line x1="370" y1="50" x2="370" y2="350" class="line" />
        <line x1="355" y1="50" x2="375" y2="50" class="line" />
        <line x1="355" y1="350" x2="375" y2="350" class="line" />
        <text x="380" y="205" class="text" transform="rotate(90 380,205)">100 mm</text>

        <!-- ابعاد سوراخ مرکزی -->
        <line x1="140" y1="200" x2="260" y2="200" class="line" />
        <text x="185" y="195" class="text">R20</text>

        <!-- ابعاد سوراخ گوشه -->
        <line x1="80" y1="80" x2="140" y2="140" class="line" />
        <text x="145" y="145" class="text">4x R5</text>

        <!-- ضخامت -->
        <text x="50" y="380" class="text">Thickness: 10 mm</text>
    </svg>
</body>
</html>
